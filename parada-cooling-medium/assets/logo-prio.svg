<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" width="220" height="150" role="img" aria-label="PRIO">
  <!--
    Recriação aproximada do mascote/marca (polvo azul) a partir da imagem colada pelo usuário
    no chat — não foi possível salvar o arquivo original (só chegou como imagem inline, sem
    anexo), então este SVG foi refeito a mão a partir da referência visual, não é um recorte
    pixel-perfect do arquivo original. Se o arquivo oficial estiver disponível depois, basta
    substituir este SVG (ou trocar por um .png) mantendo o nome "logo-prio.svg" ou ajustando
    o <img src> no relatório.
  -->
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FC3F7"/>
      <stop offset="100%" stop-color="#1D6FE0"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7FE0F5"/>
      <stop offset="100%" stop-color="#173E8C"/>
    </linearGradient>
    <linearGradient id="tentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EB3F0"/>
      <stop offset="100%" stop-color="#9FEBFF"/>
    </linearGradient>
  </defs>

  <!-- braço esquerdo, mais largo e com ponta escura -->
  <path d="M62,72 C36,80 12,82 6,97 C3,104 9,110 19,106 C42,99 63,89 79,79 C73,75 67,73 62,72 Z" fill="url(#armGrad)"/>

  <!-- tentáculos inferiores -->
  <path d="M86,90 C79,106 66,121 56,141 C53,147 61,149 66,143 C79,129 91,113 97,96 C94,93 90,91 86,90 Z" fill="url(#tentGrad)"/>
  <path d="M105,93 C102,111 100,126 100,141 C100,147 108,147 109,141 C112,123 113,107 113,93 C110,92 108,92 105,93 Z" fill="url(#tentGrad)"/>
  <path d="M122,89 C124,103 130,116 140,126 C144,130 149,125 145,120 C136,109 130,97 128,86 C126,87 124,88 122,89 Z" fill="url(#tentGrad)"/>

  <!-- cabeça -->
  <path d="M60,20 Q90,5 130,15 Q165,25 168,55 Q170,80 145,90 Q115,100 85,88 Q60,78 55,50 Q52,30 60,20 Z" fill="url(#headGrad)"/>

  <!-- olho -->
  <circle cx="140" cy="40" r="7" fill="#ffffff"/>
</svg>
